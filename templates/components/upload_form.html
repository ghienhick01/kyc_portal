{% load static %}
<div class="form-group">
  <label class="form-label">Document Type *</label>
  {{ form.document_type }}
</div>
<div class="form-group">
  <label class="form-label">Document File * <small>(PDF, JPG, PNG — max 10MB)</small></label>
  <div class="file-drop-zone" id="file-drop">
    <input type="file" name="file" id="id_file" accept=".pdf,.jpg,.jpeg,.png" class="file-input-hidden" onchange="updateFileName(this)">
    <label for="id_file" class="file-drop-label">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span id="file-name-display">Click to select or drag & drop</span>
      <small>Accepted: PDF, JPG, PNG</small>
    </label>
  </div>
</div>
<div class="form-row">
  <div class="form-group">
    <label class="form-label">Document Number</label>
    {{ form.document_number }}
  </div>
  <div class="form-group">
    <label class="form-label">Issuing Country</label>
    {{ form.issuing_country }}
  </div>
</div>
<div class="form-group">
  <label class="form-label">Expiry Date</label>
  {{ form.expiry_date }}
</div>
<div class="modal-actions">
  <button type="button" onclick="document.getElementById('doc-upload-modal').classList.remove('open')" class="btn btn-ghost">Cancel</button>
  <button type="submit" class="btn btn-primary">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Upload Document
  </button>
</div>

<script>
function updateFileName(input) {
  const display = document.getElementById('file-name-display');
  if (input.files && input.files[0]) {
    display.textContent = input.files[0].name;
    display.style.color = 'var(--accent)';
  }
}
</script>
